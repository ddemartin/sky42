services:
  sky42:
    build: .
    image: sky42:local
    container_name: sky42
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      SKY42_DATA_DIR: /app/data
      # Il database sta nel volume, non sul bind mount. Vedi sotto.
      SKY42_DB_PATH: /var/lib/sky42/sky42.db
      SKY42_HOST: "0.0.0.0"
      SKY42_PORT: "8000"

      # Il fuso serve all'interfaccia, non ai calcoli: nel database tutto è UTC
      # e JD. Ma le notti degli osservatori si leggono in ora locale, e un
      # container senza fuso sta in UTC.
      TZ: ${TZ:-Europe/Rome}

      # sky42 è un ospite: il Mac mini fa girare anche brain42 e stock42.
      SKY42_MAX_WORKERS: ${SKY42_MAX_WORKERS:-2}
      SKY42_NICE: ${SKY42_NICE:-10}
      SKY42_LOAD_LIMIT: ${SKY42_LOAD_LIMIT:-1.0}

    ports:
      # 8042 è stock42, 8142 è brain42, 8242 è sky42.
      #
      # L'indirizzo di ascolto è esplicito e di default è 127.0.0.1: pubblicare
      # senza indirizzo lega la porta a **tutte** le interfacce, e sky42 non ha
      # autenticazione. Per raggiungerlo dalle altre macchine si mette
      # l'indirizzo Tailscale di questa in SKY42_BIND_IP (file .env), non
      # 0.0.0.0: così il servizio esiste per la tailnet e non per il Wi-Fi di
      # casa. Dentro il container l'ascolto resta 0.0.0.0, o la porta
      # pubblicata non raggiungerebbe nessuno.
      - "${SKY42_BIND_IP:-127.0.0.1}:8242:8000"

    volumes:
      # **Il database sta in un volume Docker, non sul bind mount.** Il bind
      # mount di macOS passa da virtiofs, e la WAL di SQLite non ci regge: il
      # COMMIT di un import muore con `locking protocol` a servizio acceso e
      # con **SIGBUS** a servizio fermo, sempre sulla stessa riga. Misurato il
      # 2026-08-17 con un processo solo e nessun'altra connessione aperta; lo
      # stesso import su APFS passa in 108 s. Dentro un volume il filesystem è
      # ext4 nella VM di Docker, dove la memoria condivisa della WAL funziona.
      #
      # Non si perde niente: il database *è* un indice rigenerabile (regola 1).
      # Se il volume sparisce si riscarica il catalogo e si ricalcola tutto in
      # pochi minuti — ed è esattamente la prova che quella regola chiede.
      - sky42-db:/var/lib/sky42

      # Sul bind mount resta ciò che ha senso vedere dal Finder e copiare
      # altrove: i cataloghi scaricati, le effemeridi planetarie, i log e —
      # soprattutto — i backup delle sei tabelle **non** rigenerabili, che sono
      # l'unica cosa che non si ricostruisce da sé.
      - ./data:/app/data

      # `cli.py` si esegue **dentro** il container
      #
      #     docker compose exec sky42 python cli.py ingest all
      #
      # e adesso è l'unico modo possibile: dall'host il database del servizio
      # non è nemmeno raggiungibile, il che toglie di mezzo per costruzione il
      # rischio di due scrittori sullo stesso file SQLite.

volumes:
  sky42-db:
    name: sky42-db
