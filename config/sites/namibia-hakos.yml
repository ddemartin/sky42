# Esempio di sito. Un file per osservatorio, versionato in git.
# Questo file è la fonte di verità: il database lo indicizza e si rifà da solo.
#
# `code` è la chiave stabile ovunque, anche nella storia delle osservazioni:
# non si cambia mai. Per dismettere qualcosa si scrive `valid_to` e
# `active: false`, non si cancella la voce — o le osservazioni fatte con quel
# setup diventano illeggibili.
#
# pixel_scale e campo NON si scrivono: li calcola il reconcile da focale,
# pixel e binning. Scriverli a mano è il modo più facile per avere un campo
# che non corrisponde a quello delle immagini.

code: namibia-hakos
name: Hakos, Namibia
mpc_code: L81
latitude: -23.23638889          # gradi, nord positivo
longitude: 16.36169444         # gradi, est positivo
altitude_m: 2000
timezone: Africa/Windhoek   # IANA: la Namibia sta in CAT, e il database la elenca sotto il continente
specs_checked_at: null         # mai verificata contro una scheda del fornitore

# Qualità del cielo: entra nel modello di brillanza lunare, non è un commento.
sky_zenith_mag: 21.8        # V mag/arcsec² in notte scura senza Luna
extinction_k: 0.14          # mag/airmass in V

# Orizzonte locale, opzionale: [azimut, altezza minima]. Interpolato in mezzo.
# horizon:
#   - [0, 22]
#   - [90, 18]
#   - [180, 30]
#   - [270, 20]

# NON ancora in servizio: il CDK17 con la Moravian è **previsto**, non
# installato. Resta `active: false` sul setup, così non produce finestre e non
# entra in BEST SITE TONIGHT — pianificare una notte su uno strumento che non
# c'è è peggio che non averlo affatto. Quando arriva: `active: true`.
#
# La camera è DA CONFERMARE: «presumibilmente» una Moravian C5-100A, e il
# sensore qui sotto (IMX461) viene dal modello, non da una scheda tecnica letta.

telescopes:
  - code: hakos-cdk17
    name: Planewave CDK 17"
    aperture_mm: 431
    focal_length_mm: 2912          # f/6.8 nativo Planewave, nessun riduttore noto
    design: Corrected Dall-Kirkham
    min_altitude_deg: 20
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

cameras:
  - code: hakos-C5-100A
    name: Moravian C5-100A
    sensor: IMX461                 # DA CONFERMARE
    pixel_um: 3.76
    pixels_x: 11648
    pixels_y: 8742
    read_noise_e: 1.6              # nominale, non misurato

setups:
  - code: hakos-cdk17-C5-100A-bin2
    name: CDK 17" + Moravian C5-100A bin2 L
    telescope: hakos-cdk17
    camera: hakos-C5-100A
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Stima iniziale: setup_calibration la corregge con le misure vere.
    vlim_ref: 20.5                    # scalata sull'apertura, S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5
    typical_exposure_s: 60
    max_exposure_s: 600
    max_airmass: 2.0
    typical_seeing_arcsec: 1.4
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    valid_from: 2026-01-01
    active: false                     # previsto, non ancora installato
