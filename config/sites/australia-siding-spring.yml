# Sito remoto della rete iTelescope.
#
# TRE FONTI, e conta quale comanda su cosa — iTelescope non ha una pagina sola
# aggiornata, e questo è il motivo per cui questi file vanno riletti ogni tanto:
#
#   1. **support.itelescope.net, scheda del singolo telescopio** — l'autorità.
#      Ha ottica, camera, risoluzione, campo, coordinate, codice MPC, posa
#      massima e profilo d'orizzonte, e porta la data di ultima modifica. È
#      l'unica fonte che dice quando è stata aggiornata.
#   2. **/telescope-rates-premium** — dice chi è ancora a listino. Utile per
#      sapere cosa NON esiste più, meno affidabile sulle camere (dà ancora
#      l'Apogee U16M su T24, che la scheda ha sostituito ad agosto 2026).
#   3. **il foglio di rete condiviso** — è del **2022**. Ormai non serve più:
#      tiene telescopi venduti (T31) e non ha quelli nuovi (T25, T73).
#
# Scala e campo NON si scrivono qui: li deriva il reconcile da focale,
# riduttore, pixel e binning. Dichiarati e non misurati: `read_noise_e`
# (datasheet) e `vlim_ref` (stima scalata sull'apertura, ancorata a T11 → 21.0
# e T21 → 20.5). È la domanda aperta 5.
#
# Il codice camera è `<sito>-<modello>`: il telescopio non ci entra, perché
# l'accoppiata telescopio+camera **è** il setup.

code: australia-sso
name: Siding Spring Observatory, Australia
mpc_code: Q62
latitude: -31.27333            # S 31° 16' 24", dalla scheda
longitude: 149.06444            # E 149° 03' 52", dalla scheda
altitude_m: 1122          # dalla scheda di supporto
timezone: Australia/Sydney
specs_checked_at: 2026-08-18   # riletta la scheda di supporto di ogni telescopio

# Qualità del cielo: entra nel modello di brillanza lunare, non è un commento.
sky_zenith_mag: 21.6        # V mag/arcsec² in notte scura senza Luna
extinction_k: 0.16          # mag/airmass in banda V

# T31 (CDK20) NON va aggiunto: comprato da un privato, fuori rete.
# T17 è OFFLINE da mesi (verificato 2026-08-18): resta qui fuori servizio,
# torna con `active: true` sul suo setup.

telescopes:
  - code: iTelescopeT17
    name: Planewave CDK 17"
    aperture_mm: 431
    focal_length_mm: 2912          # scheda 2024-06, f/6.8. Orizzonte 20°W 35°N/S 55°E
    design: Corrected Dall-Kirkham
    min_altitude_deg: 20
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

  - code: iTelescopeT30
    name: Planewave CDK 20"
    aperture_mm: 508
    focal_length_mm: 2285          # scheda 2024-08, f/6.8
    design: Corrected Dall-Kirkham
    min_altitude_deg: 25
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

  - code: iTelescopeT32
    name: Planewave CDK 17"
    aperture_mm: 431
    focal_length_mm: 2912          # scheda 2025-08, f/6.8. Orizzonte 18°E/N 38°W 18°S
    design: Corrected Dall-Kirkham
    min_altitude_deg: 18
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

  - code: iTelescopeT59
    name: Planewave CDK 20"
    aperture_mm: 508
    focal_length_mm: 3411          # scheda 2022-06, f/6.8. Orizzonte 37°E 23°N 14°W 11°S
    design: Corrected Dall-Kirkham
    min_altitude_deg: 11
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

cameras:
  - code: sso-ASI6200MM
    name: ZWO ASI6200MM Pro
    sensor: IMX455
    pixel_um: 3.76
    pixels_x: 9576
    pixels_y: 6388
    read_noise_e: 1.5              # nominale da datasheet, non misurato

  - code: sso-PL6303E
    name: FLI PL6303E
    sensor: KAF-6303E
    pixel_um: 9
    pixels_x: 3072
    pixels_y: 2048
    read_noise_e: 10              # nominale da datasheet, non misurato

  - code: sso-PL16803
    name: FLI Proline 16803
    sensor: KAF-16803
    pixel_um: 9
    pixels_x: 4096
    pixels_y: 4096
    read_noise_e: 10              # nominale da datasheet, non misurato

setups:
  - code: iTelescopeT17-bin2
    name: T17 — CDK 17" + ZWO ASI6200MM Pro bin2 L
    telescope: iTelescopeT17
    camera: sso-ASI6200MM
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Stima iniziale: setup_calibration la corregge con le misure vere.
    vlim_ref: 20.5                    # scalata sull'apertura, S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5
    typical_exposure_s: 60
    max_exposure_s: 240                # dalla scheda di supporto iTelescope
    max_airmass: 2.0
    typical_seeing_arcsec: 1.6
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    # cost_per_hour: 0.0              # da riempire con il listino iTelescope
    # currency: USD
    valid_from: 2026-01-01
    active: false

  - code: iTelescopeT30-bin2
    name: T30 — CDK 20" + FLI PL6303E bin2 L
    telescope: iTelescopeT30
    camera: sso-PL6303E
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Stima iniziale: setup_calibration la corregge con le misure vere.
    vlim_ref: 21.0                    # scalata sull'apertura, S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5
    typical_exposure_s: 60
    max_exposure_s: 300                # dalla scheda di supporto iTelescope
    max_airmass: 2.0
    typical_seeing_arcsec: 1.6
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    # cost_per_hour: 0.0              # da riempire con il listino iTelescope
    # currency: USD
    valid_from: 2026-01-01
    active: true

  - code: iTelescopeT32-bin2
    name: T32 — CDK 17" + ZWO ASI6200MM Pro bin2 L
    telescope: iTelescopeT32
    camera: sso-ASI6200MM
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Stima iniziale: setup_calibration la corregge con le misure vere.
    vlim_ref: 20.5                    # scalata sull'apertura, S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5
    typical_exposure_s: 60
    max_exposure_s: 300                # dalla scheda di supporto iTelescope
    max_airmass: 2.0
    typical_seeing_arcsec: 1.6
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    # cost_per_hour: 0.0              # da riempire con il listino iTelescope
    # currency: USD
    valid_from: 2026-01-01
    active: true

  - code: iTelescopeT59-bin2
    name: T59 — CDK 20" + FLI Proline 16803 bin2 L
    telescope: iTelescopeT59
    camera: sso-PL16803
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Stima iniziale: setup_calibration la corregge con le misure vere.
    vlim_ref: 21.0                    # scalata sull'apertura, S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5
    typical_exposure_s: 60
    max_exposure_s: 900                # dalla scheda di supporto iTelescope
    max_airmass: 2.0
    typical_seeing_arcsec: 1.6
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    # cost_per_hour: 0.0              # da riempire con il listino iTelescope
    # currency: USD
    valid_from: 2026-01-01
