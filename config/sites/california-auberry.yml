# Sito remoto della rete iTelescope.
#
# TRE FONTI, e conta quale comanda su cosa — iTelescope non ha una pagina sola
# aggiornata, e questo è il motivo per cui questi file vanno riletti ogni tanto:
#
#   1. **support.itelescope.net, scheda del singolo telescopio** — l'autorità.
#      Ha ottica, camera, risoluzione, campo, coordinate, codice MPC, posa
#      massima e profilo d'orizzonte, e porta la data di ultima modifica. È
#      l'unica fonte che dice quando è stata aggiornata.
#   2. **/telescope-rates-premium** — dice chi è ancora a listino. Utile per
#      sapere cosa NON esiste più, meno affidabile sulle camere (dà ancora
#      l'Apogee U16M su T24, che la scheda ha sostituito ad agosto 2026).
#   3. **il foglio di rete condiviso** — è del **2022**. Ormai non serve più:
#      tiene telescopi venduti (T31) e non ha quelli nuovi (T25, T73).
#
# Scala e campo NON si scrivono qui: li deriva il reconcile da focale,
# riduttore, pixel e binning. Dichiarati e non misurati: `read_noise_e`
# (datasheet) e `vlim_ref` (stima scalata sull'apertura, ancorata a T11 → 21.0
# e T21 → 20.5). È la domanda aperta 5.
#
# Il codice camera è `<sito>-<modello>`: il telescopio non ci entra, perché
# l'accoppiata telescopio+camera **è** il setup.

code: usa-sierra-remote
name: Sierra Remote Observatories, Auberry, California USA
mpc_code: U69
latitude: 37.07                # dalla scheda di T24
longitude: -119.4               # dalla scheda di T24
altitude_m: 1405          # dalla scheda di supporto
timezone: America/Los_Angeles
specs_checked_at: 2026-08-18   # riletta la scheda di supporto di ogni telescopio

# Qualità del cielo: entra nel modello di brillanza lunare, non è un commento.
sky_zenith_mag: 21.5        # V mag/arcsec² in notte scura senza Luna
extinction_k: 0.16          # mag/airmass in banda V

telescopes:
  - code: iTelescopeT24
    name: Planewave CDK 24"
    aperture_mm: 610
    focal_length_mm: 3927          # scheda 2026-08 (la più fresca), f/6.5. Bin2 obbligatorio
    design: Corrected Dall-Kirkham
    min_altitude_deg: 25
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

cameras:
  - code: sro-ZEUS455M
    name: Player One Zeus 455M Pro
    sensor: IMX455
    pixel_um: 3.76
    pixels_x: 9576
    pixels_y: 6388
    read_noise_e: 1.5              # nominale da datasheet, non misurato

setups:
  - code: iTelescopeT24-bin2
    name: T24 — CDK 24" + Player One Zeus 455M Pro bin2 L
    telescope: iTelescopeT24
    camera: sro-ZEUS455M
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Stima iniziale: setup_calibration la corregge con le misure vere.
    vlim_ref: 21.5                    # scalata sull'apertura, S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5
    typical_exposure_s: 60
    max_exposure_s: 600                # dalla scheda di supporto iTelescope
    max_airmass: 2.0
    typical_seeing_arcsec: 1.6
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    # cost_per_hour: 0.0              # da riempire con il listino iTelescope
    # currency: USD
    valid_from: 2026-01-01
    active: true
