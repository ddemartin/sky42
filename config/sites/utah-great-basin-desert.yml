# Esempio di sito. Un file per osservatorio, versionato in git.
# Questo file è la fonte di verità: il database lo indicizza e si rifà da solo.
#
# `code` è la chiave stabile ovunque, anche nella storia delle osservazioni:
# non si cambia mai. Per dismettere qualcosa si scrive `valid_to` e
# `active: false`, non si cancella la voce — o le osservazioni fatte con quel
# setup diventano illeggibili.
#
# pixel_scale e campo NON si scrivono: li calcola il reconcile da focale,
# pixel e binning. Scriverli a mano è il modo più facile per avere un campo
# che non corrisponde a quello delle immagini.

code: UDRO
name: Great Basin Desert, Utah, USA
mpc_code: U94
latitude: 37.73777778          # gradi, nord positivo
longitude: -113.6975         # gradi, est positivo
altitude_m: 1570
timezone: America/Denver   # IANA: lo Utah non ha un fuso suo, sta in Mountain Time

# Qualità del cielo: entra nel modello di brillanza lunare, non è un commento.
sky_zenith_mag: 21.8        # V mag/arcsec² in notte scura senza Luna
extinction_k: 0.14          # mag/airmass in V

# Orizzonte locale, opzionale: [azimut, altezza minima]. Interpolato in mezzo.
# horizon:
#   - [0, 22]
#   - [90, 18]
#   - [180, 30]
#   - [270, 20]

telescopes:
  - code: iTelescopeT11
    name: Planewave 20"
    aperture_mm: 500
    focal_length_mm: 2280
    design: Corrected Dall-Kirkham
    min_altitude_deg: 25
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

  - code: iTelescopeT21
    name: Planewave 17"
    aperture_mm: 430
    focal_length_mm: 1940
    design: Corrected Dall-Kirkham
    min_altitude_deg: 25
    max_track_rate_arcsec_min: 300    # null se non c'è un limite noto
    meridian_flip: false

cameras:
  - code: FLI-PL11002M
    name: FLI PL11002M
    sensor: KAF-11002
    pixel_um: 3.76
    pixels_x: 4008
    pixels_y: 2672
    read_noise_e: 3.0

  - code: FLI-PL6303E
    name: FLI PL6303E
    sensor: KAF-11002
    pixel_um: 3.76
    pixels_x: 3072
    pixels_y: 2048
    read_noise_e: 3.0

setups:
  - code: iTelescopeT11-FLI-PL11002M-bin2
    name: Planewave 20" + FLI PL11002M bin2 L
    telescope: iTelescopeT11
    camera: FLI-PL11002M
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Il limite dichiarato è una stima iniziale: setup_calibration lo corregge
    # con le misure vere, e il reconcile non lo sovrascrive se ci sono misure.
    vlim_ref: 21.0                    # rivelazione S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5      # quanto togliere per astrometria affidabile
    typical_exposure_s: 60
    max_exposure_s: 600
    max_airmass: 2.0
    typical_seeing_arcsec: 1.6
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    # Quanto costa un'ora di questo setup. Su un telescopio affittato il tempo
    # si paga, e senza questo numero ogni confronto fra strumenti finisce sul
    # più grande. Da riempire con il listino vero: il costo di una sessione lo
    # calcola sky42 dal tempo totale di posa.
    # cost_per_hour: 0.0
    # currency: EUR
    valid_from: 2026-01-01
    active: true

  - code: iTelescopeT21-FLI-PL6303E-bin2
    name: Planewave 17" + FLI PL6303E bin2 L
    telescope: iTelescopeT21
    camera: FLI-PL6303E
    binning: 2
    filter: L
    focal_reducer: 1.0
    # Il limite dichiarato è una stima iniziale: setup_calibration lo corregge
    # con le misure vere, e il reconcile non lo sovrascrive se ci sono misure.
    vlim_ref: 20.5                    # rivelazione S/N≈5
    vlim_ref_exposure_s: 120
    vlim_astrometric_delta: -0.5      # quanto togliere per astrometria affidabile
    typical_exposure_s: 60
    max_exposure_s: 600
    max_airmass: 2.0
    typical_seeing_arcsec: 1.6
    sun_alt_max_deg: -15              # accetta l'ultima parte del crepuscolo nautico
    # Quanto costa un'ora di questo setup. Su un telescopio affittato il tempo
    # si paga, e senza questo numero ogni confronto fra strumenti finisce sul
    # più grande. Da riempire con il listino vero: il costo di una sessione lo
    # calcola sky42 dal tempo totale di posa.
    # cost_per_hour: 0.0
    # currency: EUR
    valid_from: 2026-01-01
    active: true
